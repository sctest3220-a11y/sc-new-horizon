name: Question inventory checks and deployment
on:
  pull_request:
    branches: [main]
    paths: &inventory_paths
      - 'exports/review-inventory/**'
      - 'public/stimuli/**'
      - 'app/admin/question-inventory/**'
      - 'app/globals.css'
      - 'deploy/inventory-preview/**'
      - 'scripts/*inventory*.mjs'
      - 'scripts/lib/inventory-*.mjs'
      - 'scripts/*feedback*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/question-inventory.yml'
  push:
    branches: [main]
    paths: *inventory_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test-inventory-release.mjs
      - run: node scripts/build-inventory-cloudflare.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test built Worker
        shell: bash
        run: |
          # Wrangler watches the generated inventory assets in local mode.
          # The 889-question release contains more files than the runner's
          # default descriptor limit, so raise it before starting the worker.
          ulimit -n 65536 || true
          pnpm exec wrangler d1 execute new-horizon-inventory-results --config work/inventory-cloudflare/dist/server/wrangler.json --local --file app/api/results/schema.sql
          pnpm exec wrangler dev --config work/inventory-cloudflare/dist/server/wrangler.json --port 4174 > /tmp/inventory-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:4174/review-release.json >/dev/null; then break; fi
            sleep 1
          done
          if ! kill -0 "$worker_pid" 2>/dev/null; then
            cat /tmp/inventory-worker.log
            exit 1
          fi
          curl -sS -L -D /tmp/inventory-route-headers.log http://localhost:4174/admin/question-inventory -o /tmp/inventory-route-body.html || true
          route_status=$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' /tmp/inventory-route-headers.log)
          if [ "$route_status" != "200" ]; then
            echo "Inventory route status: $route_status"
            cat /tmp/inventory-route-headers.log
            head -c 4000 /tmp/inventory-route-body.html || true
            echo
          fi
          TEST_URL=http://localhost:4174/admin/question-inventory node scripts/test-inventory-cloudflare.mjs || {
            cat /tmp/inventory-worker.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ github.sha }}
          path: |
            work/inventory-cloudflare/dist
            work/inventory-cloudflare/public/review-release.json
          retention-days: 90
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'sctest3220-a11y/sc-new-horizon'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: inventory-testing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: inventory-${{ github.sha }}
          path: work/inventory-cloudflare
      - name: Skip superseded main commits
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: a newer commit is already on main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the tested artifact
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in the inventory-testing environment'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID in the inventory-testing environment'; exit 1; }
          pnpm exec wrangler deploy --config work/inventory-cloudflare/dist/server/wrangler.json
      - name: Verify deployed release
        if: steps.current.outputs.deploy == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected = JSON.parse(fs.readFileSync('work/inventory-cloudflare/public/review-release.json'));
          const url = 'https://new-horizon-question-inventory-test.new-horizon-sc.workers.dev';
          let success = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${url}/review-release.json`, { cache: 'no-store' });
              const actual = await response.json();
              if (actual.releaseId === expected.releaseId) { success = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!success) throw new Error('Cloudflare is not serving the expected release; inspect deployment and rollback if needed.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Deployed [inventory](${url})\n\nRelease: ${expected.releaseId}\n\nQuestion version: ${expected.contentVersion}\n`);
          JS
