<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">AI adoption and trust heatmap</title>
  <desc id="desc">A team adoption heatmap showing usage, quality, reporting behavior, manager modeling, and learning loops.</desc>
  <rect width="980" height="620" fill="#f7f8f5"/>
  <text x="42" y="54" font-family="Inter,Arial" font-size="28" font-weight="700" fill="#20252a">AI Adoption Health Check</text>
  <text x="42" y="84" font-family="Inter,Arial" font-size="15" fill="#5d666b">Question target: choose interventions that build trust, review habits, and learning loops.</text>
  <g font-family="Inter,Arial" font-size="14" fill="#20252a">
    <rect x="42" y="120" width="896" height="420" rx="12" fill="#ffffff" stroke="#d4dcde"/>
    <text x="74" y="160" font-weight="700">Team</text>
    <text x="220" y="160" font-weight="700">Usage</text>
    <text x="340" y="160" font-weight="700">Quality</text>
    <text x="470" y="160" font-weight="700">Challenge behavior</text>
    <text x="650" y="160" font-weight="700">Manager modeling</text>
    <text x="820" y="160" font-weight="700">Next step</text>
    <line x1="74" y1="176" x2="890" y2="176" stroke="#d9e1e4"/>
    <text x="74" y="220">Support</text><rect x="220" y="198" width="70" height="30" fill="#138a63"/><rect x="340" y="198" width="70" height="30" fill="#e7b44b"/><text x="470" y="220">Low: few flags</text><text x="650" y="220">Mixed</text><text x="820" y="220">Review huddle</text>
    <text x="74" y="274">Sales</text><rect x="220" y="252" width="70" height="30" fill="#e7b44b"/><rect x="340" y="252" width="70" height="30" fill="#138a63"/><text x="470" y="274">Medium</text><text x="650" y="274">Strong</text><text x="820" y="274">Share prompts</text>
    <text x="74" y="328">Finance</text><rect x="220" y="306" width="70" height="30" fill="#9b3f1f"/><rect x="340" y="306" width="70" height="30" fill="#e7b44b"/><text x="470" y="328">High: cautious</text><text x="650" y="328">Low</text><text x="820" y="328">Use-case clinic</text>
    <text x="74" y="382">Marketing</text><rect x="220" y="360" width="70" height="30" fill="#138a63"/><rect x="340" y="360" width="70" height="30" fill="#9b3f1f"/><text x="470" y="382">Low: quiet errors</text><text x="650" y="382">High speed focus</text><text x="820" y="382">Quality rubric</text>
    <rect x="74" y="436" width="816" height="58" rx="6" fill="#f1f5f6"/>
    <text x="96" y="466" font-weight="700">Interpretation</text>
    <text x="210" y="466">High use is not enough. Healthy adoption requires review routines and safe challenge behavior.</text>
  </g>
</svg>
