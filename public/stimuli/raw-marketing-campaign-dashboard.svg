<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945">
  <rect width="1680" height="945" fill="#f4f7fb"/>
  <rect x="80" y="60" width="1520" height="825" rx="24" fill="#fff" stroke="#334155" stroke-width="3"/>
  <text x="120" y="122" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Campaign Dashboard Export</text>
  <text x="120" y="166" font-family="Arial" font-size="22" fill="#475467">AI recommendation: "Scale Ad Set C immediately. It has the highest conversion rate."</text>
  <g font-family="Arial" font-size="22">
    <rect x="120" y="220" width="1440" height="72" fill="#e0f2fe"/>
    <text x="150" y="265" font-weight="700">Ad set</text><text x="360" y="265" font-weight="700">Spend</text><text x="570" y="265" font-weight="700">Clicks</text><text x="780" y="265" font-weight="700">Conversions</text><text x="1040" y="265" font-weight="700">Rate</text><text x="1220" y="265" font-weight="700">Quality note</text>
    <rect x="120" y="292" width="1440" height="82" fill="#fff"/>
    <text x="150" y="342">A</text><text x="360" y="342">$8,200</text><text x="570" y="342">9,840</text><text x="780" y="342">312</text><text x="1040" y="342">3.2%</text><text x="1220" y="342">Normal traffic</text>
    <rect x="120" y="374" width="1440" height="82" fill="#f8fafc"/>
    <text x="150" y="424">B</text><text x="360" y="424">$7,900</text><text x="570" y="424">8,510</text><text x="780" y="424">289</text><text x="1040" y="424">3.4%</text><text x="1220" y="424">Normal traffic</text>
    <rect x="120" y="456" width="1440" height="82" fill="#fff7ed"/>
    <text x="150" y="506">C</text><text x="360" y="506">$900</text><text x="570" y="506">93</text><text x="780" y="506">8</text><text x="1040" y="506" fill="#b42318">8.6%</text><text x="1220" y="506">Tiny sample, coupon leak</text>
  </g>
  <rect x="120" y="630" width="560" height="132" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="672" font-family="Arial" font-size="24" font-weight="700" fill="#991b1b">Suspicious point</text>
  <text x="150" y="710" font-family="Arial" font-size="20" fill="#991b1b">Ad Set C has the highest rate but only 93 clicks and a coupon anomaly.</text>
  <rect x="740" y="630" width="560" height="132" fill="#ecfdf3" stroke="#22c55e" stroke-width="2"/>
  <text x="770" y="672" font-family="Arial" font-size="24" font-weight="700" fill="#166534">Better question</text>
  <text x="770" y="710" font-family="Arial" font-size="20" fill="#166534">Ask for confidence, sample size, incrementality, and traffic-quality checks.</text>
</svg>
