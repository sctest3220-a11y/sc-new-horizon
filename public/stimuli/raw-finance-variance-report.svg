<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945">
  <rect width="1680" height="945" fill="#eef4f3"/>
  <rect x="70" y="55" width="1540" height="835" rx="24" fill="#ffffff" stroke="#24545a" stroke-width="3"/>
  <text x="112" y="118" font-family="Arial" font-size="34" font-weight="700" fill="#15343a">Raw Finance Variance Report</text>
  <text x="112" y="164" font-family="Arial" font-size="22" fill="#52636a">AI conclusion: "Marketing overspend is the main reason margin missed target."</text>
  <g font-family="Arial" font-size="22" fill="#111827">
    <rect x="112" y="220" width="1456" height="70" fill="#dbeafe"/>
    <text x="138" y="264" font-weight="700">Line item</text><text x="520" y="264" font-weight="700">Budget</text><text x="760" y="264" font-weight="700">Actual</text><text x="1000" y="264" font-weight="700">Variance</text><text x="1230" y="264" font-weight="700">Note</text>
    <rect x="112" y="290" width="1456" height="82" fill="#fff"/>
    <text x="138" y="340">Marketing spend</text><text x="520" y="340">$420k</text><text x="760" y="340">$505k</text><text x="1000" y="340" fill="#b42318">+20%</text><text x="1230" y="340">Campaign pulled forward</text>
    <rect x="112" y="372" width="1456" height="82" fill="#f8fafc"/>
    <text x="138" y="422">Cloud compute</text><text x="520" y="422">$310k</text><text x="760" y="422">$511k</text><text x="1000" y="422" fill="#b42318">+65%</text><text x="1230" y="422">No baseline by AI project</text>
    <rect x="112" y="454" width="1456" height="82" fill="#fff"/>
    <text x="138" y="504">Support revenue</text><text x="520" y="504">$760k</text><text x="760" y="504">$612k</text><text x="1000" y="504" fill="#b42318">-19%</text><text x="1230" y="504">Churn spike in SMB segment</text>
    <rect x="112" y="536" width="1456" height="82" fill="#f8fafc"/>
    <text x="138" y="586">Vendor credits</text><text x="520" y="586">$0</text><text x="760" y="586">$90k</text><text x="1000" y="586" fill="#067647">+90k</text><text x="1230" y="586">One-time, non-recurring</text>
  </g>
  <rect x="112" y="674" width="620" height="96" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="140" y="714" font-family="Arial" font-size="22" font-weight="700" fill="#9a3412">Missing from AI summary</text>
  <text x="140" y="750" font-family="Arial" font-size="20" fill="#9a3412">Compute and revenue variance are larger drivers than marketing alone.</text>
  <rect x="790" y="674" width="620" height="96" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="818" y="714" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">Decision risk</text>
  <text x="818" y="750" font-family="Arial" font-size="20" fill="#991b1b">One-time vendor credit should not be treated as recurring margin lift.</text>
</svg>
