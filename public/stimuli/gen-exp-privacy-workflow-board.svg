<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
  <title id="title">Everyday AI workflow board with privacy and review decisions</title>
  <desc id="desc">A realistic workflow map for using AI on personal and work documents, showing inputs, risks, review gates, and measurable outcomes.</desc>
  <rect width="1080" height="700" fill="#f5f6f8"/>
  <rect x="46" y="42" width="988" height="596" rx="14" fill="#ffffff" stroke="#d4dce7"/>
  <text x="76" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">AI Task Decision Board</text>
  <text x="76" y="110" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Scenario: use an AI assistant to turn messy documents into a weekly plan</text>
  <g>
    <rect x="76" y="154" width="214" height="142" rx="10" fill="#eef6ff" stroke="#bfdbfe"/>
    <text x="96" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Inputs</text>
    <text x="96" y="214" font-family="Arial, sans-serif" font-size="13" fill="#263241">School notice PDF</text>
    <text x="96" y="238" font-family="Arial, sans-serif" font-size="13" fill="#263241">Work meeting notes</text>
    <text x="96" y="262" font-family="Arial, sans-serif" font-size="13" fill="#263241">Personal calendar screenshot</text>
  </g>
  <g>
    <rect x="330" y="154" width="214" height="142" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="350" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">AI step</text>
    <text x="350" y="214" font-family="Arial, sans-serif" font-size="13" fill="#263241">Summarize commitments</text>
    <text x="350" y="238" font-family="Arial, sans-serif" font-size="13" fill="#263241">Draft reminders</text>
    <text x="350" y="262" font-family="Arial, sans-serif" font-size="13" fill="#263241">Suggest priority order</text>
  </g>
  <g>
    <rect x="584" y="154" width="214" height="142" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="604" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Risk checks</text>
    <text x="604" y="214" font-family="Arial, sans-serif" font-size="13" fill="#263241">Remove account numbers</text>
    <text x="604" y="238" font-family="Arial, sans-serif" font-size="13" fill="#263241">Verify names and dates</text>
    <text x="604" y="262" font-family="Arial, sans-serif" font-size="13" fill="#263241">Do not upload private client info</text>
  </g>
  <g>
    <rect x="838" y="154" width="154" height="142" rx="10" fill="#ecfdf5" stroke="#86efac"/>
    <text x="858" y="184" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Human gate</text>
    <text x="858" y="214" font-family="Arial, sans-serif" font-size="13" fill="#263241">Approve final plan</text>
    <text x="858" y="238" font-family="Arial, sans-serif" font-size="13" fill="#263241">Correct priority</text>
    <text x="858" y="262" font-family="Arial, sans-serif" font-size="13" fill="#263241">Send manually</text>
  </g>
  <path d="M290 225 H330" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="330,225 318,218 318,232" fill="#94a3b8"/>
  <path d="M544 225 H584" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="584,225 572,218 572,232" fill="#94a3b8"/>
  <path d="M798 225 H838" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="838,225 826,218 826,232" fill="#94a3b8"/>
  <rect x="76" y="338" width="916" height="104" rx="10" fill="#fbfcfe" stroke="#d7dee8"/>
  <text x="98" y="369" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#263241">Decision log</text>
  <text x="98" y="399" font-family="Arial, sans-serif" font-size="13" fill="#263241">1. Keep work notes and family calendar in separate chats or approved workspaces.</text>
  <text x="98" y="424" font-family="Arial, sans-serif" font-size="13" fill="#263241">2. Replace screenshots containing addresses or account details with typed, minimal facts.</text>
  <text x="584" y="399" font-family="Arial, sans-serif" font-size="13" fill="#263241">3. Use AI for draft prioritization, not for deciding what commitments are valid.</text>
  <text x="584" y="424" font-family="Arial, sans-serif" font-size="13" fill="#263241">4. Measure usefulness by time saved and fewer missed follow-ups.</text>
  <rect x="76" y="482" width="284" height="102" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Value metric</text>
  <text x="98" y="544" font-family="Arial, sans-serif" font-size="13" fill="#263241">Before: 45 minutes weekly planning</text>
  <text x="98" y="568" font-family="Arial, sans-serif" font-size="13" fill="#263241">Target: 20 minutes with fewer missed tasks</text>
  <rect x="398" y="482" width="284" height="102" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="420" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Do not delegate</text>
  <text x="420" y="544" font-family="Arial, sans-serif" font-size="13" fill="#263241">Medical, legal, disciplinary, or financial decisions</text>
  <text x="420" y="568" font-family="Arial, sans-serif" font-size="13" fill="#263241">without qualified human review.</text>
  <rect x="720" y="482" width="272" height="102" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="742" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3">Collaboration norm</text>
  <text x="742" y="544" font-family="Arial, sans-serif" font-size="13" fill="#263241">Share what AI changed, what was checked,</text>
  <text x="742" y="568" font-family="Arial, sans-serif" font-size="13" fill="#263241">and what still needs human judgment.</text>
</svg>
