<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard ผลแคมเปญของโฆษณาชุด A, B และ C</title>
  <desc id="desc">โฆษณาชุด C มี Conversion rate 8.6 เปอร์เซ็นต์ จาก 93 คลิกและ 8 Conversion บันทึกระบุว่าโค้ดส่วนลดปรากฏบนเว็บรวมคูปองสาธารณะ AI แนะนำให้เพิ่มงบ 60 เปอร์เซ็นต์</desc>
  <rect width="1600" height="1000" fill="#eef2f6"/>
  <rect x="54" y="42" width="1492" height="916" rx="10" fill="#ffffff" stroke="#c7d0da" stroke-width="2"/>
