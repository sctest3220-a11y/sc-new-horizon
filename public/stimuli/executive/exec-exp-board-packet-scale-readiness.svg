  <text x="452" y="269" font-family="Arial, sans-serif" font-size="15" fill="#2b2b2b">Quality audit: sampled only approved cases</text>
  <text x="452" y="296" font-family="Arial, sans-serif" font-size="15" fill="#2b2b2b">Process owner: named after business case</text>

