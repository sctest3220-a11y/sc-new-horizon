  <text x="803" y="269" font-family="Arial, sans-serif" font-size="15" fill="#2b2b2b">Vendor to define success metric</text>
  <text x="803" y="296" font-family="Arial, sans-serif" font-size="15" fill="#2b2b2b">Board update after procurement signature</text>

  <text x="86" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2a30">Portfolio Page 12: Proposed AI Programs</text>
  <rect x="86" y="378" width="1028" height="230" fill="#ffffff" stroke="#b8c0c4"/>
