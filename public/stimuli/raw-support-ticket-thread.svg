<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945">
  <rect width="1680" height="945" fill="#f5f5f4"/>
  <rect x="88" y="62" width="1504" height="820" rx="22" fill="#ffffff" stroke="#3f3f46" stroke-width="3"/>
  <text x="128" y="124" font-family="Arial" font-size="34" font-weight="700" fill="#18181b">Raw Support Ticket Thread</text>
  <text x="128" y="168" font-family="Arial" font-size="22" fill="#52525b">AI draft: "Refund denied. Customer caused the issue."</text>
  <rect x="128" y="222" width="1420" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="156" y="264" font-family="Arial" font-size="22" font-weight="700" fill="#111827">Customer</text>
  <text x="156" y="300" font-family="Arial" font-size="21" fill="#111827">"The app charged me twice after checkout froze. I only received one order confirmation."</text>
  <rect x="128" y="358" width="1420" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="156" y="400" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">System log</text>
  <text x="156" y="436" font-family="Arial" font-size="21" fill="#1e3a8a">Payment gateway retry at 14:32:18. Duplicate auth captured. Fulfillment created one order.</text>
  <rect x="128" y="494" width="1420" height="110" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="156" y="536" font-family="Arial" font-size="22" font-weight="700" fill="#9a3412">Policy note</text>
  <text x="156" y="572" font-family="Arial" font-size="21" fill="#9a3412">Duplicate capture: refund duplicate charge after payment verification. Apologize and provide case ID.</text>
  <rect x="128" y="648" width="650" height="104" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="158" y="690" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">AI draft problem</text>
  <text x="158" y="724" font-family="Arial" font-size="20" fill="#991b1b">It ignores the system log and policy exception.</text>
  <rect x="840" y="648" width="650" height="104" fill="#ecfdf3" stroke="#22c55e" stroke-width="2"/>
  <text x="870" y="690" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Better action</text>
  <text x="870" y="724" font-family="Arial" font-size="20" fill="#166534">Verify payment, refund duplicate, and give a clear next step.</text>
</svg>
