    <text x="130" y="332">09:12:14 POST   slack:#incident-room draft             allowed</text>
    <text x="130" y="378">09:12:22 WRITE  jira:INC-448 priority=P1              allowed</text>
    <text x="130" y="424">09:12:37 EMAIL  external:vendor-support@example.com   blocked: needs approval</text>
