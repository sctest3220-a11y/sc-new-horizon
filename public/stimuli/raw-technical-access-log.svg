  <rect x="120" y="610" width="650" height="126" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="652" font-family="Arial" font-size="23" font-weight="700" fill="#dbeafe">Good control</text>
  <text x="150" y="690" font-family="Arial" font-size="20" fill="#dbeafe">External email and public updates require human approval.</text>
  <rect x="835" y="610" width="650" height="126" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <text x="865" y="652" font-family="Arial" font-size="23" font-weight="700" fill="#fee2e2">Review needed</text>
  <text x="865" y="690" font-family="Arial" font-size="20" fill="#fee2e2">The agent attempted HR notes and secrets beyond incident scope.</text>
