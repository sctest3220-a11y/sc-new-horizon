  <text x="120" y="122" font-family="Arial" font-size="34" font-weight="700" fill="#e0f2fe">Raw Tool Connector Access Log</text>
  <text x="120" y="166" font-family="Arial" font-size="22" fill="#bae6fd">AI assistant attempted to automate incident triage across tools.</text>
  <g font-family="Menlo, Consolas, monospace" font-size="21" fill="#d1d5db">
    <text x="130" y="240">09:12:03 READ   /prod/logs/payments/*                  allowed</text>
