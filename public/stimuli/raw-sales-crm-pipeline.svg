<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945" role="img" aria-labelledby="title desc">
  <title id="title">Sales CRM pipeline and AI forecast review</title>
  <desc id="desc">A sales pipeline artifact with CRM stages, stale opportunities, missing next steps, AI forecast claims, and customer risk notes.</desc>
  <rect width="1680" height="945" fill="#f4f6fb"/>
  <rect x="64" y="58" width="1552" height="829" rx="28" fill="#fffdf8" stroke="#d8d2c1" stroke-width="3"/>
  <text x="104" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#17201d">Sales CRM Review: AI Forecast Draft</text>
  <text x="104" y="158" font-family="Arial, sans-serif" font-size="20" fill="#656b76">Inspect raw opportunity evidence before trusting the AI forecast and follow-up plan.</text>
  <rect x="104" y="214" width="948" height="488" rx="18" fill="#f8fbff" stroke="#b8c8e6" stroke-width="3"/>
  <text x="134" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#3b6ea8">Open Opportunities</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#17201d">
    <rect x="134" y="292" width="888" height="52" fill="#17201d" rx="8"/>
    <text x="154" y="326" fill="#fff" font-weight="800">Account</text>
    <text x="432" y="326" fill="#fff" font-weight="800">Stage</text>
    <text x="620" y="326" fill="#fff" font-weight="800">Value</text>
    <text x="768" y="326" fill="#fff" font-weight="800">Last touch</text>
    <text x="910" y="326" fill="#fff" font-weight="800">Risk</text>
    <text x="154" y="386">Aster Retail</text><text x="432" y="386">Proposal</text><text x="620" y="386">$84k</text><text x="768" y="386">2 days</text><text x="910" y="386">Low</text>
    <text x="154" y="452">Blue Harbor</text><text x="432" y="452">Verbal yes</text><text x="620" y="452">$126k</text><text x="768" y="452">31 days</text><text x="910" y="452">Legal hold</text>
    <text x="154" y="518">CityMed</text><text x="432" y="518">Discovery</text><text x="620" y="518">$220k</text><text x="768" y="518">4 days</text><text x="910" y="518">Data review</text>
    <text x="154" y="584">Northline</text><text x="432" y="584">Procurement</text><text x="620" y="584">$74k</text><text x="768" y="584">18 days</text><text x="910" y="584">No champion</text>
    <text x="154" y="650">Siam Foods</text><text x="432" y="650">Pilot</text><text x="620" y="650">$52k</text><text x="768" y="650">1 day</text><text x="910" y="650">Strong</text>
  </g>
  <rect x="1116" y="214" width="424" height="488" rx="18" fill="#fff7f3" stroke="#e2b9a2" stroke-width="3"/>
  <text x="1146" y="260" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#b45f3a">AI Forecast Draft</text>
  <text x="1146" y="314" font-family="Arial, sans-serif" font-size="21" fill="#17201d">"Pipeline is very strong.</text>
  <text x="1146" y="348" font-family="Arial, sans-serif" font-size="21" fill="#17201d">Blue Harbor can be counted</text>
  <text x="1146" y="382" font-family="Arial, sans-serif" font-size="21" fill="#17201d">in this quarter because the</text>
  <text x="1146" y="416" font-family="Arial, sans-serif" font-size="21" fill="#17201d">stage says verbal yes."</text>
  <line x1="1146" y1="462" x2="1496" y2="462" stroke="#e2b9a2" stroke-width="3"/>
  <circle cx="1164" cy="514" r="8" fill="#b45f3a"/>
  <text x="1190" y="522" font-family="Arial, sans-serif" font-size="20" fill="#17201d">31 days since last touch</text>
  <circle cx="1164" cy="568" r="8" fill="#b45f3a"/>
  <text x="1190" y="576" font-family="Arial, sans-serif" font-size="20" fill="#17201d">Legal hold unresolved</text>
  <circle cx="1164" cy="622" r="8" fill="#a27a23"/>
  <text x="1190" y="630" font-family="Arial, sans-serif" font-size="20" fill="#17201d">No probability evidence shown</text>
  <rect x="104" y="756" width="1436" height="56" rx="28" fill="#17201d"/>
  <text x="136" y="792" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Practical task: qualify the forecast, choose next sales actions, and avoid overpromising revenue.</text>
</svg>
