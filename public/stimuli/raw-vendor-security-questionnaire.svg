<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Raw AI vendor security questionnaire</title>
  <desc id="desc">A vendor questionnaire with missing audit, retention, monitoring, and subprocessor answers.</desc>
  <rect width="1200" height="760" fill="#f4f1e8"/>
  <rect x="76" y="56" width="1048" height="650" rx="20" fill="#fff" stroke="#d8d6ca" stroke-width="3"/>
  <text x="124" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17201d">Vendor Security Questionnaire</text>
  <text x="124" y="158" font-family="Arial, sans-serif" font-size="18" fill="#65706b">Product: AI workflow platform | Status: procurement review</text>
  <g font-family="Arial, sans-serif" font-size="21">
    <rect x="124" y="204" width="952" height="54" fill="#17201d"/>
    <text x="152" y="239" fill="#fff" font-weight="700">Control</text>
    <text x="526" y="239" fill="#fff" font-weight="700">Vendor response</text>
    <rect x="124" y="258" width="952" height="72" fill="#fff" stroke="#d8d6ca"/>
    <text x="152" y="303" fill="#17201d">Audit access</text>
    <text x="526" y="303" fill="#b45f3a" font-weight="700">Not available in current package</text>
    <rect x="124" y="330" width="952" height="72" fill="#f8f6ef" stroke="#d8d6ca"/>
    <text x="152" y="375" fill="#17201d">Data retention</text>
    <text x="526" y="375" fill="#b45f3a" font-weight="700">Vendor standard terms</text>
    <rect x="124" y="402" width="952" height="72" fill="#fff" stroke="#d8d6ca"/>
    <text x="152" y="447" fill="#17201d">Subprocessors</text>
    <text x="526" y="447" fill="#b45f3a" font-weight="700">List shared after signature</text>
    <rect x="124" y="474" width="952" height="72" fill="#f8f6ef" stroke="#d8d6ca"/>
    <text x="152" y="519" fill="#17201d">Model monitoring</text>
    <text x="526" y="519" fill="#a27a23" font-weight="700">Roadmap item</text>
    <rect x="124" y="546" width="952" height="72" fill="#fff" stroke="#d8d6ca"/>
    <text x="152" y="591" fill="#17201d">Exit / portability</text>
    <text x="526" y="591" fill="#b45f3a" font-weight="700">Not specified</text>
  </g>
</svg>
