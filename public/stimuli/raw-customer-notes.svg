<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Raw customer interview notes</title>
  <desc id="desc">A raw note table showing positive comments, payment complaints, and missing sample details.</desc>
  <rect width="1200" height="760" fill="#eef2f0"/>
  <rect x="78" y="64" width="1044" height="632" rx="20" fill="#fff" stroke="#d8d6ca" stroke-width="3"/>
  <text x="124" y="126" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17201d">Raw Interview Notes: Checkout</text>
  <text x="124" y="164" font-family="Arial, sans-serif" font-size="19" fill="#65706b">AI summary: “Users love the new checkout.”</text>
  <g font-family="Arial, sans-serif" font-size="21">
    <rect x="124" y="212" width="952" height="54" fill="#17201d"/>
    <text x="152" y="247" fill="#fff" font-weight="700">Signal</text>
    <text x="428" y="247" fill="#fff" font-weight="700">Count</text>
    <text x="586" y="247" fill="#fff" font-weight="700">Raw notes</text>
    <rect x="124" y="266" width="952" height="92" fill="#f8f6ef" stroke="#d8d6ca"/>
    <text x="152" y="318" fill="#3f7d57" font-weight="700">Positive comments</text>
    <text x="452" y="318" fill="#17201d" font-weight="700">5</text>
    <text x="586" y="306" fill="#17201d">“Faster than before”; “cleaner page”</text>
    <text x="586" y="334" fill="#17201d">“I like the saved address”</text>
    <rect x="124" y="358" width="952" height="118" fill="#fff" stroke="#d8d6ca"/>
    <text x="152" y="424" fill="#b45f3a" font-weight="700">Payment failures</text>
    <text x="452" y="424" fill="#17201d" font-weight="700">9</text>
    <text x="586" y="402" fill="#17201d">“Card failed twice”; “wallet button froze”</text>
    <text x="586" y="432" fill="#17201d">“Had to restart”; “gave up on mobile”</text>
    <rect x="124" y="476" width="952" height="92" fill="#fff7ed" stroke="#e5a46b"/>
    <text x="152" y="528" fill="#8e4526" font-weight="700">Sample description</text>
    <text x="432" y="528" fill="#17201d" font-weight="700">?</text>
    <text x="586" y="528" fill="#17201d">No segment, sample size, or interview dates recorded</text>
  </g>
  <rect x="124" y="604" width="952" height="58" rx="12" fill="#fdecea"/>
  <text x="154" y="641" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8e4526">Question: what did the AI summary hide or overstate?</text>
</svg>
