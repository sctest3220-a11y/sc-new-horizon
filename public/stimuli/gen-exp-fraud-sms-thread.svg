<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="title desc">
  <title id="title">Suspicious delivery SMS and payment page</title>
  <desc id="desc">A realistic mobile message thread and browser checkout showing fraud signals such as urgency, shortened link, fee request, mismatched domain, and card collection.</desc>
  <rect width="980" height="660" fill="#f4f5f7"/>
  <rect x="54" y="36" width="344" height="588" rx="34" fill="#16191f"/>
  <rect x="70" y="58" width="312" height="544" rx="24" fill="#ffffff"/>
  <rect x="70" y="58" width="312" height="64" rx="24" fill="#f7f8fa"/>
  <circle cx="106" cy="91" r="17" fill="#d8dee8"/>
  <text x="136" y="87" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#222831">Parcel Notice</text>
  <text x="136" y="108" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">+1 (844) 019-7742</text>
  <text x="96" y="156" font-family="Arial, sans-serif" font-size="11" fill="#8a94a6">Today 8:14 AM</text>
  <rect x="95" y="178" width="252" height="134" rx="18" fill="#edf1f7"/>
  <text x="113" y="205" font-family="Arial, sans-serif" font-size="15" fill="#18202a">Your package is held due</text>
  <text x="113" y="227" font-family="Arial, sans-serif" font-size="15" fill="#18202a">to unpaid customs fee.</text>
  <text x="113" y="249" font-family="Arial, sans-serif" font-size="15" fill="#18202a">Pay $2.98 within 30 min</text>
  <text x="113" y="271" font-family="Arial, sans-serif" font-size="15" fill="#18202a">to prevent return:</text>
  <text x="113" y="294" font-family="Arial, sans-serif" font-size="15" fill="#1f65d6">http://trk-pstl.cc/8Qz</text>
  <rect x="144" y="346" width="210" height="72" rx="18" fill="#0b74de"/>
  <text x="165" y="376" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">I am expecting a package.</text>
  <text x="165" y="398" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">Is this safe?</text>
  <rect x="95" y="450" width="252" height="92" rx="18" fill="#edf1f7"/>
  <text x="113" y="478" font-family="Arial, sans-serif" font-size="15" fill="#18202a">Final reminder. Payment</text>
  <text x="113" y="500" font-family="Arial, sans-serif" font-size="15" fill="#18202a">window closes soon.</text>
  <text x="113" y="522" font-family="Arial, sans-serif" font-size="15" fill="#18202a">No phone support today.</text>
  <rect x="452" y="58" width="466" height="544" rx="18" fill="#ffffff" stroke="#cfd6e2"/>
  <rect x="452" y="58" width="466" height="54" rx="18" fill="#eef2f8"/>
  <circle cx="484" cy="85" r="7" fill="#ef4444"/>
  <circle cx="506" cy="85" r="7" fill="#f59e0b"/>
  <circle cx="528" cy="85" r="7" fill="#22c55e"/>
  <rect x="556" y="74" width="310" height="23" rx="11" fill="#ffffff" stroke="#d5dbe5"/>
  <text x="573" y="91" font-family="Arial, sans-serif" font-size="12" fill="#7b8494">trk-pstl.cc / verify-delivery</text>
  <text x="488" y="154" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Postal Delivery Confirmation</text>
  <text x="488" y="184" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Pay a small customs balance to release your parcel.</text>
  <rect x="488" y="214" width="384" height="58" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="510" y="239" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Action required</text>
  <text x="510" y="260" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">Your item will be returned if payment is not completed today.</text>
  <rect x="488" y="306" width="180" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="502" y="331" font-family="Arial, sans-serif" font-size="13" fill="#374151">Fee due: $2.98</text>
  <rect x="692" y="306" width="180" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="706" y="331" font-family="Arial, sans-serif" font-size="13" fill="#374151">Tracking: US-88I0-O1</text>
  <text x="488" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#374151">Card number</text>
  <rect x="488" y="404" width="384" height="42" rx="8" fill="#ffffff" stroke="#aeb8c8"/>
  <text x="506" y="430" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">0000 0000 0000 0000</text>
  <text x="488" y="474" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#374151">Name and billing ZIP</text>
  <rect x="488" y="486" width="384" height="42" rx="8" fill="#ffffff" stroke="#aeb8c8"/>
  <rect x="488" y="552" width="384" height="38" rx="8" fill="#2563eb"/>
  <text x="625" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Release parcel</text>
  <g fill="none" stroke="#dc2626" stroke-width="3">
    <circle cx="822" cy="86" r="24"/>
    <path d="M810 86h24"/>
    <path d="M822 74v24"/>
    <circle cx="626" cy="294" r="24"/>
    <path d="M614 294h24"/>
    <circle cx="872" cy="424" r="24"/>
    <path d="M860 424h24"/>
  </g>
  <text x="805" y="132" font-family="Arial, sans-serif" font-size="12" fill="#b91c1c">mismatched domain</text>
  <text x="593" y="285" font-family="Arial, sans-serif" font-size="12" fill="#b91c1c">pressure</text>
  <text x="780" y="465" font-family="Arial, sans-serif" font-size="12" fill="#b91c1c">card collection</text>
</svg>
